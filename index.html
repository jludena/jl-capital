<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JL CAPITAL — Case 001 PepsiCo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
.app{width:100%;height:100%;display:flex;flex-direction:column;background:#111}
.top{height:54px;display:flex;align-items:center;justify-content:center;gap:8px;background:#050b10;border-bottom:1px solid #1c3444;padding:6px 8px;flex:0 0 auto}
button,select{height:38px;background:#071723;color:#eef7fc;border:1px solid #24516a;border-radius:7px;font-size:13px}
button{width:42px} select{max-width:360px;min-width:210px;padding:0 8px}
.count{font-size:12px;color:#93a8b5;min-width:48px;text-align:center}
.viewer{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#1a1a1a;overflow:hidden}
#slide{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.msg{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(1,8,13,.88);border:1px solid #24485e;border-radius:6px;padding:6px 10px;color:#b7c8d2;font-size:11px;opacity:0;transition:.18s;pointer-events:none}
.msg.on{opacity:1}
@media(max-width:700px){
  .top{height:52px;gap:5px}
  select{min-width:150px;max-width:180px;font-size:11px}
  button{width:38px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button id="prev" aria-label="Anterior">◀</button>
    <select id="sel" aria-label="Sección"></select>
    <span class="count" id="count"></span>
    <button id="next" aria-label="Siguiente">▶</button>
    <button id="full" aria-label="Pantalla completa">⛶</button>
  </div>
  <div class="viewer" id="viewer">
    <img id="slide" alt="">
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
const slides=[{"id": "summary", "title": "Resumen General", "src": "01_Resumen_General.jpg"}, {"id": "business", "title": "Business Score", "src": "02_Business_Score.jpg"}, {"id": "entry", "title": "Entry & Accumulation", "src": "03_Entry_Accumulation.jpg"}, {"id": "portfolio", "title": "Portfolio Fit", "src": "04_Portfolio_Fit.jpg"}, {"id": "thesis", "title": "Tesis de Inversión", "src": "05_Tesis_de_Inversion.jpg"}, {"id": "monthly", "title": "Revisión Mensual", "src": "06_Revision_Mensual.jpg"}, {"id": "chart", "title": "Gráfico & Niveles", "src": "07_Grafico_y_Niveles.jpg"}, {"id": "financials", "title": "Estados Financieros", "src": "08_Estados_Financieros.jpg"}, {"id": "metrics", "title": "Métricas Clave", "src": "09_Metricas_Clave.jpg"}, {"id": "brands", "title": "Marcas & Negocio", "src": "10_Marcas_y_Negocio.jpg"}, {"id": "research", "title": "Research Interno", "src": "11_Research_Interno.jpg"}];
let i=0;
const img=document.getElementById('slide'),sel=document.getElementById('sel'),count=document.getElementById('count'),msg=document.getElementById('msg');
slides.forEach((s,n)=>{const o=document.createElement('option');o.value=n;o.textContent=(n+1)+'. '+s.title;sel.appendChild(o);});
function show(n){
  i=(n+slides.length)%slides.length;
  img.src=slides[i].src;
  img.alt=slides[i].title;
  sel.value=i;
  count.textContent=(i+1)+' / '+slides.length;
  msg.textContent=slides[i].title; msg.classList.add('on'); setTimeout(()=>msg.classList.remove('on'),550);
}
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
sel.onchange=()=>show(+sel.value);
document.getElementById('full').onclick=async()=>{const v=document.getElementById('viewer');try{if(!document.fullscreenElement)await v.requestFullscreen?.();else await document.exitFullscreen?.();}catch(e){}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});
show(0);
</script>
</body>
</html>
