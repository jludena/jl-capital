<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<title>JL CAPITAL — Case 001 PepsiCo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
.app{width:100%;height:100%;display:flex;flex-direction:column;background:#111}.top{height:54px;display:flex;align-items:center;justify-content:center;gap:8px;background:#050b10;border-bottom:1px solid #1c3444;padding:6px 8px;flex:0 0 auto;z-index:20}
button,select{height:38px;background:#071723;color:#eef7fc;border:1px solid #24516a;border-radius:7px;font-size:13px}button{width:42px}select{max-width:360px;min-width:210px;padding:0 8px}.count{font-size:12px;color:#93a8b5;min-width:48px;text-align:center}
.viewer{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#1a1a1a;overflow:hidden}.stage{position:relative;width:min(100vw,calc((100vh - 54px)*1.5));aspect-ratio:3/2;flex:0 0 auto}
#slide{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}.hotspots{position:absolute;inset:0;pointer-events:none}.hot{position:absolute;left:0;width:13.4%;height:4.35%;border:0;border-radius:0;background:transparent;padding:0;margin:0;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hot:active,.hot.flash{background:rgba(22,141,246,.22);box-shadow:inset 3px 0 0 #3ca7ff}.msg{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(1,8,13,.9);border:1px solid #24485e;border-radius:6px;padding:6px 10px;color:#d7e5ed;font-size:11px;opacity:0;transition:.18s;pointer-events:none;z-index:30;white-space:nowrap}.msg.on{opacity:1}
@media(max-width:700px){.top{height:52px;gap:5px}select{min-width:150px;max-width:180px;font-size:11px}button{width:38px}.stage{width:min(100vw,calc((100vh - 52px)*1.5))}.hot{width:15.2%;height:4.6%}}
</style></head><body>
<div class="app"><div class="top"><button id="prev">◀</button><select id="sel"></select><span class="count" id="count"></span><button id="next">▶</button><button id="full">⛶</button></div>
<div class="viewer" id="viewer"><div class="stage"><img id="slide" alt=""><div class="hotspots" id="hotspots"></div></div><div class="msg" id="msg"></div></div></div>
<script>
const slides=[
{id:'summary',title:'Resumen General',src:'01_Resumen_General.jpg'},
{id:'business',title:'Business Score',src:'02_Business_Score.jpg'},
{id:'entry',title:'Entry & Accumulation',src:'03_Entry_Accumulation.jpg'},
{id:'portfolio',title:'Portfolio Fit',src:'04_Portfolio_Fit.jpg'},
{id:'thesis',title:'Tesis de Inversión',src:'05_Tesis_de_Inversion.jpg'},
{id:'monthly',title:'Revisión Mensual',src:'06_Revision_Mensual.jpg'},
{id:'chart',title:'Gráfico & Niveles',src:'07_Grafico_y_Niveles.jpg'},
{id:'financials',title:'Estados Financieros',src:'08_Estados_Financieros.jpg'},
{id:'metrics',title:'Métricas Clave',src:'09_Metricas_Clave.jpg'},
{id:'brands',title:'Marcas & Negocio',src:'10_Marcas_y_Negocio.jpg'},
{id:'research',title:'Research Interno',src:'11_Research_Interno.jpg'}];
let i=0;const img=document.getElementById('slide'),sel=document.getElementById('sel'),count=document.getElementById('count'),msg=document.getElementById('msg'),hotspots=document.getElementById('hotspots');
slides.forEach((s,n)=>{const o=document.createElement('option');o.value=n;o.textContent=(n+1)+'. '+s.title;sel.appendChild(o)});
const navTop=[22.8,26.8,30.8,34.8,38.8,42.8,46.8,50.8,54.8,58.8,62.8];
navTop.forEach((top,n)=>{const b=document.createElement('button');b.className='hot';b.style.top=top+'%';b.title=slides[n].title;b.onclick=e=>{e.preventDefault();e.stopPropagation();b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),120);show(n)};hotspots.appendChild(b)});
function toast(t){msg.textContent=t;msg.classList.add('on');clearTimeout(window.__t);window.__t=setTimeout(()=>msg.classList.remove('on'),700)}
function show(n){i=(n+slides.length)%slides.length;img.src=slides[i].src;img.alt=slides[i].title;sel.value=i;count.textContent=(i+1)+' / '+slides.length;history.replaceState(null,'','#'+slides[i].id);toast(slides[i].title)}
prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);sel.onchange=()=>show(+sel.value);full.onclick=async()=>{const v=document.getElementById('viewer');try{if(!document.fullscreenElement)await v.requestFullscreen?.();else await document.exitFullscreen?.()}catch(e){}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});const h=location.hash.slice(1);const s=slides.findIndex(x=>x.id===h);show(s>=0?s:0);
</script></body></html>
